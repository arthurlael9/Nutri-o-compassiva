<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Corrigir notas — Nutrição Compassiva</title>
<style>
  body{font-family:sans-serif;max-width:640px;margin:60px auto;padding:0 24px;background:#FAF5EA;color:#2A2420;}
  h1{font-size:1.4rem;}
  button{background:#E8722F;color:#fff;border:none;padding:16px 28px;font-size:1rem;font-weight:600;
    border-radius:4px;cursor:pointer;margin:20px 0;}
  button:disabled{background:#ccc;cursor:not-allowed;}
  #log{background:#fff;border:1px solid #E7DCC8;border-radius:4px;padding:16px;max-height:420px;overflow-y:auto;
    font-size:.85rem;line-height:1.6;white-space:pre-wrap;}
  .ok{color:#2E7D74;}
  .err{color:#D6455B;}
</style>
</head>
<body>
  <h1>Adicionar 5 estrelas aos depoimentos importados</h1>
  <p>Esta página atualiza para <strong>5 estrelas</strong> todos os depoimentos do banco de dados que
  ainda estão sem nota (os 42 que você acabou de importar). Clique uma única vez.</p>
  <button id="startBtn">Adicionar 5 estrelas aos depoimentos sem nota</button>
  <div id="log"></div>

<script>
  const SUPABASE_URL = 'https://uteotjwbxuxhlpsexpxu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_GxMYpT_wd4K0IkXEcVCujA_tKcB66dV';

  const btn = document.getElementById('startBtn');
  const log = document.getElementById('log');

  function addLog(msg, cls){
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Atualizando...';
    addLog('Buscando depoimentos sem nota...');

    try {
      // busca quantos registros têm rating = 0 antes de atualizar
      const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/reviews?select=id,name&rating=eq.0`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const toUpdate = await checkRes.json();
      addLog(`Encontrados ${toUpdate.length} depoimentos sem nota.`);

      if (toUpdate.length === 0) {
        addLog('Nada para atualizar — todos já têm nota.', 'ok');
        btn.textContent = 'Concluído';
        return;
      }

      const res = await fetch(`${SUPABASE_URL}/rest/v1/reviews?rating=eq.0`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=representation'
        },
        body: JSON.stringify({ rating: 5 })
      });

      if (res.ok) {
        const updated = await res.json();
        updated.forEach(r => addLog(`✓ ${r.name} → 5 estrelas`, 'ok'));
        addLog(`\nFinalizado: ${updated.length} depoimentos atualizados para 5 estrelas.`, 'ok');
      } else {
        const errText = await res.text();
        addLog(`✗ Erro na atualização — ${errText.slice(0,300)}`, 'err');
      }
    } catch (e) {
      addLog(`✗ Erro — ${e.message}`, 'err');
    }

    btn.textContent = 'Concluído';
  });
</script>
</body>
</html>
